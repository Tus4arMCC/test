<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Wishlist Screen</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec1380",
                        "background-light": "#f8f6f7",
                        "background-dark": "#221019",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"],
                        "body": ["Noto Sans", "sans-serif"],
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hiding */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased transition-colors duration-200">
<div class="relative flex min-h-screen w-full flex-col overflow-hidden pb-24">
<!-- Top App Bar -->
<header class="sticky top-0 z-50 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-sm border-b border-gray-200 dark:border-gray-800 transition-colors">
<div class="flex items-center justify-between p-4 pb-2">
<!-- Empty div for balance if back button exists, or just spacing -->
<div class="w-12 flex items-center justify-start">
<!-- Optional Back Button -->
<!-- <button class="text-gray-900 dark:text-white"><span class="material-symbols-outlined">arrow_back</span></button> -->
</div>
<h2 class="text-[#1b0d14] dark:text-white text-xl font-bold leading-tight tracking-[-0.015em] flex-1 text-center">
                    My Wishlist
                </h2>
<div class="flex w-12 items-center justify-end">
<button class="flex items-center justify-center rounded-full w-10 h-10 hover:bg-gray-100 dark:hover:bg-white/10 text-[#1b0d14] dark:text-white transition-colors relative">
<span class="material-symbols-outlined text-[24px]">shopping_bag</span>
<span class="absolute top-1.5 right-1.5 flex h-2.5 w-2.5">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-75"></span>
<span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-primary"></span>
</span>
</button>
</div>
</div>
<!-- Segmented Controls & Meta Info -->
<div class="px-4 py-3 flex flex-col gap-4">
<div class="flex items-center justify-between gap-4">
<p class="text-[#9a4c73] dark:text-pink-300/80 text-sm font-medium leading-normal">
                        4 items saved
                    </p>
<!-- Segmented Toggle -->
<div class="flex h-9 items-center justify-center rounded-lg bg-[#f3e7ed] dark:bg-white/10 p-1 w-32">
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-md px-2 has-[:checked]:bg-white dark:has-[:checked]:bg-[#221019] has-[:checked]:shadow-sm has-[:checked]:text-[#ec1380] text-[#9a4c73] dark:text-gray-300 text-xs font-bold transition-all">
<span class="material-symbols-outlined text-[18px] mr-1">grid_view</span>
<input checked="" class="invisible w-0 absolute" name="view-toggle" type="radio" value="Grid"/>
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-md px-2 has-[:checked]:bg-white dark:has-[:checked]:bg-[#221019] has-[:checked]:shadow-sm has-[:checked]:text-[#ec1380] text-[#9a4c73] dark:text-gray-300 text-xs font-bold transition-all">
<span class="material-symbols-outlined text-[18px] mr-1">view_list</span>
<input class="invisible w-0 absolute" name="view-toggle" type="radio" value="List"/>
</label>
</div>
</div>
</div>
</header>
<!-- Main Content: Product Grid -->

<div class="grid grid-cols-2 gap-4">
<!-- Item 1: Oversized Wool Blazer -->

<div class="relative w-full aspect-[3/4] rounded-xl overflow-hidden bg-gray-100 dark:bg-gray-800">

<span class="material-symbols-outlined text-[20px]">close</span>
</button>
<!-- Low Stock Badge -->
<div class="absolute bottom-2 left-2 px-2 py-1 bg-white/90 dark:bg-black/80 backdrop-blur-sm rounded text-[10px] font-bold uppercase tracking-wider text-red-600 dark:text-red-400">
                            Low Stock
                        </div>
</div>
<div class="flex flex-col gap-1">
<p class="text-[#9a4c73] dark:text-pink-300/70 text-xs font-semibold tracking-wider uppercase">Acme Studios</p>
<h3 class="text-[#1b0d14] dark:text-white text-sm font-bold leading-tight line-clamp-2">Oversized Wool Blazer</h3>
<p class="text-primary text-base font-bold">$129.00</p>
<button class="mt-2 flex w-full items-center justify-center rounded-lg h-9 bg-primary active:bg-pink-700 text-white text-sm font-semibold shadow-sm hover:shadow-md transition-all">
<span class="truncate">Move to Bag</span>
</button>
</div>
</article>
<!-- Item 2: Silk Midi Dress -->
<article class="group relative flex flex-col gap-2">
<div class="relative w-full aspect-[3/4] rounded-xl overflow-hidden bg-gray-100 dark:bg-gray-800">
<img alt="Model posing in a flowing silk midi dress against a plain background" class="h-full w-full object-cover object-center transition-transform duration-500 group-hover:scale-105" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCxRz6SgcOiR2jgImbc4OPXFCmzZPT6FijZ701QYkxdeQyhuI12wsmw7WsYFkX94HDv8T7_PV9N8ZfEoZiJ0jOzFI1n63j-hNTlE36r0XtwVYAeEpXL4CaxeTAet2TWeHASoKeUVL42Do5DVa_aDfKhnXafQrHIMdkhgODKt473kYWh5rMutcBb-orOPAEtjaccY-eFk96SiECAp8jdQ4LaHxC9FM9w8kGGc1R1MWolKkVmwRxgdLa2CyYfOYPPIhklo1LsCmTrRNBL"/>
<button class="absolute top-2 right-2 p-2 bg-white/60 dark:bg-black/40 backdrop-blur-md rounded-full text-gray-700 dark:text-white hover:text-red-500 dark:hover:text-red-400 transition-colors">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<div class="flex flex-col gap-1">
<p class="text-[#9a4c73] dark:text-pink-300/70 text-xs font-semibold tracking-wider uppercase">Luxe</p>
<h3 class="text-[#1b0d14] dark:text-white text-sm font-bold leading-tight line-clamp-2">Silk Midi Dress</h3>
<div class="flex items-center gap-2">
<p class="text-primary text-base font-bold">$245.00</p>
</div>
<button class="mt-2 flex w-full items-center justify-center rounded-lg h-9 bg-primary active:bg-pink-700 text-white text-sm font-semibold shadow-sm hover:shadow-md transition-all">
<span class="truncate">Move to Bag</span>
</button>
</div>
</article>
<!-- Item 3: Leather Crossbody -->
<article class="group relative flex flex-col gap-2">
<div class="relative w-full aspect-[3/4] rounded-xl overflow-hidden bg-gray-100 dark:bg-gray-800">
<img alt="Close up of a luxury black leather handbag on a marble surface" class="h-full w-full object-cover object-center transition-transform duration-500 group-hover:scale-105" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDRG2sutZ7Q777Lr6DekUG3NR2aRnYR-WPjiuVggQo_4_6dWHZ2-tdZ07QVFEsqwBiYpHbt4It0kqpzPCSEp8IVxHqqt8zpm6Bsoprf3AqucN0fic3nltgnoP9n-YsaRRka-E8C456w8VePaTvWFCTXW0EqfAKnF4-ht3IBS9aX-n3urbwMM3QtQoLOno9bOZwSKfs2EghGreRurBJfbnVL_ybGDdvQNfIDX2f4Nf1o-g-90xQIezA8coMfzIOSHkhYRe1c8dmf8UJi"/>
<button class="absolute top-2 right-2 p-2 bg-white/60 dark:bg-black/40 backdrop-blur-md rounded-full text-gray-700 dark:text-white hover:text-red-500 dark:hover:text-red-400 transition-colors">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<div class="flex flex-col gap-1">
<p class="text-[#9a4c73] dark:text-pink-300/70 text-xs font-semibold tracking-wider uppercase">Vogue</p>
<h3 class="text-[#1b0d14] dark:text-white text-sm font-bold leading-tight line-clamp-2">Mini Leather Bag</h3>
<p class="text-primary text-base font-bold">$890.00</p>
<button class="mt-2 flex w-full items-center justify-center rounded-lg h-9 bg-primary active:bg-pink-700 text-white text-sm font-semibold shadow-sm hover:shadow-md transition-all">
<span class="truncate">Move to Bag</span>
</button>
</div>
</article>
<!-- Item 4: Chunky Sneakers -->
<article class="group relative flex flex-col gap-2">
<div class="relative w-full aspect-[3/4] rounded-xl overflow-hidden bg-gray-100 dark:bg-gray-800">
<img alt="Detailed shot of white chunky fashion sneakers with pink accents" class="h-full w-full object-cover object-center transition-transform duration-500 group-hover:scale-105" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCmcVmIskSrFdfwfQCBlcdpiNPjf67ROpPJ_yMaOIi-NBQ_4fAQ89GLQT7BosClAtBqag1pOehTLOmQikKMjEdZypaRARZnBXeq8MAIXxcLxygX-Ce_gag8EgFk8Iz9UNPWSpVW41vnIaxis3dP5owFbVzhDv9qxKQpG8QuSbUTSHum_01C83TyV3gZ5XDJMZq7iJbarOjFjE1Coz8gBlSdtVtS9fbTGUFd0zijN2TKOfJkjYAyJIZcRZMFn_0HPsZ4NiOm_AoR2aTQ"/>

<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<div class="flex flex-col gap-1">
<p class="text-[#9a4c73] dark:text-pink-300/70 text-xs font-semibold tracking-wider uppercase">Street</p>
<h3 class="text-[#1b0d14] dark:text-white text-sm font-bold leading-tight line-clamp-2">Chunky Sole Sneakers</h3>
<div class="flex items-center gap-2">
<p class="text-primary text-base font-bold">$115.00</p>
<p class="text-gray-400 text-xs line-through">$145.00</p>
</div>
<button class="mt-2 flex w-full items-center justify-center rounded-lg h-9 bg-primary active:bg-pink-700 text-white text-sm font-semibold shadow-sm hover:shadow-md transition-all">
<span class="truncate">Move to Bag</span>
</button>
</div>
</article>
<!-- Skeleton Loader 1 (Simulating Loading More) -->
<div aria-hidden="true" class="flex flex-col gap-2 animate-pulse">
<div class="w-full aspect-[3/4] bg-gray-200 dark:bg-white/5 rounded-xl"></div>
<div class="flex flex-col gap-2 mt-1">
<div class="h-3 w-1/3 bg-gray-200 dark:bg-white/5 rounded"></div>
<div class="h-4 w-3/4 bg-gray-200 dark:bg-white/5 rounded"></div>
<div class="h-4 w-1/4 bg-gray-200 dark:bg-white/5 rounded"></div>
<div class="h-9 w-full bg-gray-200 dark:bg-white/5 rounded-lg mt-1"></div>
</div>
</div>
<!-- Skeleton Loader 2 (Simulating Loading More) -->
<div aria-hidden="true" class="flex flex-col gap-2 animate-pulse">
<div class="w-full aspect-[3/4] bg-gray-200 dark:bg-white/5 rounded-xl"></div>
<div class="flex flex-col gap-2 mt-1">
<div class="h-3 w-1/3 bg-gray-200 dark:bg-white/5 rounded"></div>
<div class="h-4 w-2/3 bg-gray-200 dark:bg-white/5 rounded"></div>
<div class="h-4 w-1/4 bg-gray-200 dark:bg-white/5 rounded"></div>
<div class="h-9 w-full bg-gray-200 dark:bg-white/5 rounded-lg mt-1"></div>
</div>
</div>
</div>
<!-- End of list state -->
<div class="w-full py-8 flex flex-col items-center justify-center text-center opacity-60">
<p class="text-xs text-[#9a4c73] dark:text-pink-300">That's all for now</p>
</div>
</main>
<!-- Bottom Navigation -->
<nav class="fixed bottom-0 left-0 right-0 bg-background-light dark:bg-background-dark border-t border-gray-200 dark:border-gray-800 px-6 py-2 pb-6 z-50">
<ul class="flex items-center justify-between">
<li>
<a class="flex flex-col items-center justify-center gap-1 text-gray-400 hover:text-[#1b0d14] dark:hover:text-white transition-colors group" href="#">
<span class="material-symbols-outlined text-[28px] group-hover:-translate-y-0.5 transition-transform">home</span>
<span class="text-[10px] font-medium">Home</span>
</a>
</li>
<li>
<a class="flex flex-col items-center justify-center gap-1 text-gray-400 hover:text-[#1b0d14] dark:hover:text-white transition-colors group" href="#">
<span class="material-symbols-outlined text-[28px] group-hover:-translate-y-0.5 transition-transform">search</span>
<span class="text-[10px] font-medium">Search</span>
</a>
</li>
<li>
<a class="flex flex-col items-center justify-center gap-1 text-primary transition-colors" href="#">
<span class="material-symbols-outlined fill-current text-[28px]">favorite</span>
<span class="text-[10px] font-bold">Wishlist</span>
</a>
</li>
<li>
<a class="flex flex-col items-center justify-center gap-1 text-gray-400 hover:text-[#1b0d14] dark:hover:text-white transition-colors group" href="#">
<span class="material-symbols-outlined text-[28px] group-hover:-translate-y-0.5 transition-transform">person</span>
<span class="text-[10px] font-medium">Profile</span>
</a>
</li>
</ul>
</nav>
</div>
