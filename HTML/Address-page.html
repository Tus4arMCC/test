<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>My Addresses - Fashion App</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec1380",
                        "primary-dark": "#c90d6b",
                        "background-light": "#f8f6f7",
                        "background-dark": "#221019",
                        "surface-light": "#ffffff",
                        "surface-dark": "#331825",
                        "subtle-light": "#f3e7ed",
                        "subtle-dark": "#4a2436",
                        "text-main": "#1b0d14",
                        "text-muted": "#9a4c73",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem", 
                        "lg": "0.5rem", 
                        "xl": "0.75rem", 
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(236, 19, 128, 0.05)',
                        'card': '0 2px 8px -2px rgba(27, 13, 20, 0.05)',
                    }
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hiding for cleaner mobile look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-text-main dark:text-white transition-colors duration-300 min-h-screen relative">
<!-- Header -->
<header class="sticky top-0 z-20 bg-background-light/90 dark:bg-background-dark/90 backdrop-blur-md border-b border-primary/5 dark:border-white/5 px-4 pt-safe-top pb-4 transition-all">
<!-- Safe area spacing for notch -->
<div class="h-2 w-full"></div>
<div class="flex items-center justify-between h-12">
<button aria-label="Go back" class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-black/5 dark:hover:bg-white/10 active:scale-95 transition-transform text-text-main dark:text-white">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h1 class="text-lg font-bold tracking-tight text-center flex-1 pr-10">My Addresses</h1>
</div>
</header>
<!-- Main Content -->
<main class="px-4 py-6 pb-32 flex flex-col gap-5 max-w-md mx-auto w-full">
<!-- Address Card: Default -->
<div class="group relative bg-surface-light dark:bg-surface-dark rounded-2xl p-5 shadow-card border-2 border-primary transition-all duration-300">
<!-- Default Badge -->
<div class="absolute -top-3 right-4 bg-primary text-white text-[10px] font-bold uppercase tracking-wider px-2 py-1 rounded-full shadow-sm">
                Default
            </div>
<div class="flex items-start gap-4 mb-4">
<div class="flex-shrink-0 w-12 h-12 rounded-xl bg-subtle-light dark:bg-subtle-dark flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[24px]">home</span>
</div>
<div class="flex-1 min-w-0">
<div class="flex justify-between items-start">
<h3 class="font-bold text-base truncate pr-2">Jane Doe (Home)</h3>
</div>
<p class="text-sm text-text-muted mt-1 leading-relaxed">
                        123 Fashion Ave, Apt 4B<br/>
                        New York, NY 10012<br/>
<span class="text-xs opacity-80 mt-1 block">(555) 123-4567</span>
</p>
</div>
<div class="flex-shrink-0 pt-1">
<span class="material-symbols-outlined text-primary text-2xl fill-current">check_circle</span>
</div>
</div>
<!-- Actions Divider -->
<div class="h-px w-full bg-subtle-light dark:bg-white/10 mb-3"></div>
<!-- Action Buttons -->
<div class="flex justify-start gap-6">
<button class="flex items-center gap-1.5 text-sm font-semibold text-text-muted hover:text-primary transition-colors py-1 group/btn">
<span class="material-symbols-outlined text-[18px] group-hover/btn:scale-110 transition-transform">edit</span>
                    Edit
                </button>
<button class="flex items-center gap-1.5 text-sm font-semibold text-text-muted hover:text-red-500 transition-colors py-1 group/btn">
<span class="material-symbols-outlined text-[18px] group-hover/btn:scale-110 transition-transform">delete</span>
                    Delete
                </button>
</div>
</div>
<!-- Address Card: Work -->
<div class="group relative bg-surface-light dark:bg-surface-dark rounded-2xl p-5 shadow-card border border-transparent hover:border-primary/20 transition-all duration-300">
<div class="flex items-start gap-4 mb-4">
<div class="flex-shrink-0 w-12 h-12 rounded-xl bg-subtle-light dark:bg-subtle-dark flex items-center justify-center text-text-muted dark:text-white/70">
<span class="material-symbols-outlined text-[24px]">work</span>
</div>
<div class="flex-1 min-w-0">
<div class="flex justify-between items-start">
<h3 class="font-bold text-base truncate pr-2">Jane Doe (Work)</h3>
</div>
<p class="text-sm text-text-muted mt-1 leading-relaxed">
                        456 Style St, Suite 101<br/>
                        New York, NY 10018<br/>
<span class="text-xs opacity-80 mt-1 block">(555) 987-6543</span>
</p>
</div>
<div class="flex-shrink-0 pt-1">
<button class="text-gray-300 dark:text-gray-600 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-2xl">radio_button_unchecked</span>
</button>
</div>
</div>
<!-- Actions Divider -->
<div class="h-px w-full bg-subtle-light dark:bg-white/10 mb-3"></div>
<!-- Action Buttons -->
<div class="flex justify-start gap-6">
<button class="flex items-center gap-1.5 text-sm font-semibold text-text-muted hover:text-primary transition-colors py-1 group/btn">
<span class="material-symbols-outlined text-[18px] group-hover/btn:scale-110 transition-transform">edit</span>
                    Edit
                </button>
<button class="flex items-center gap-1.5 text-sm font-semibold text-text-muted hover:text-red-500 transition-colors py-1 group/btn">
<span class="material-symbols-outlined text-[18px] group-hover/btn:scale-110 transition-transform">delete</span>
                    Delete
                </button>
<button class="ml-auto text-sm font-semibold text-primary hover:text-primary-dark transition-colors py-1">
                    Set as Default
                </button>
</div>
</div>
<!-- Skeleton Loading State (Demo) -->
<div class="animate-pulse">
<div class="flex items-center justify-between mb-4 px-2">
<span class="text-xs font-bold uppercase tracking-wider text-text-muted opacity-50">Loading example</span>
</div>
<div class="bg-white dark:bg-surface-dark rounded-2xl p-5 border border-transparent">
<div class="flex items-start gap-4 mb-4">
<!-- Icon Skeleton -->
<div class="flex-shrink-0 w-12 h-12 rounded-xl bg-gray-200 dark:bg-gray-700"></div>
<div class="flex-1 min-w-0 space-y-3 pt-1">
<!-- Title Skeleton -->
<div class="h-4 bg-gray-200 dark:bg-gray-700 rounded w-1/3"></div>
<!-- Address Lines Skeleton -->
<div class="space-y-2">
<div class="h-3 bg-gray-100 dark:bg-gray-800 rounded w-3/4"></div>
<div class="h-3 bg-gray-100 dark:bg-gray-800 rounded w-1/2"></div>
<div class="h-3 bg-gray-100 dark:bg-gray-800 rounded w-1/4 mt-2"></div>
</div>
</div>
<!-- Checkbox Skeleton -->
<div class="flex-shrink-0 w-6 h-6 rounded-full bg-gray-200 dark:bg-gray-700"></div>
</div>
<div class="h-px w-full bg-gray-100 dark:bg-gray-800 mb-3"></div>
<div class="flex gap-6">
<div class="h-4 w-12 bg-gray-200 dark:bg-gray-700 rounded"></div>
<div class="h-4 w-16 bg-gray-200 dark:bg-gray-700 rounded"></div>
</div>
</div>
</div>
</main>
<!-- Floating Action Button Area -->
<div class="fixed bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-background-light via-background-light to-transparent dark:from-background-dark dark:via-background-dark pt-8 pb-6 pointer-events-none z-10 flex justify-center">
<div class="pointer-events-auto w-full max-w-md shadow-soft rounded-xl overflow-hidden">
<button class="w-full bg-primary hover:bg-primary-dark text-white font-bold text-base h-14 rounded-xl flex items-center justify-center gap-2 transition-all active:scale-[0.98] shadow-lg shadow-primary/30">
<span class="material-symbols-outlined text-[20px]">add</span>
                Add New Address
            </button>
</div>
</div>
<!-- Toast Notification (Hidden by default, shown for design completeness) -->
<!-- Ideally this would be triggered by JS -->
<div class="fixed top-20 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 translate-y-[-10px]">
<div class="bg-text-main dark:bg-white text-white dark:text-text-main px-4 py-3 rounded-lg shadow-xl flex items-center gap-3 min-w-[300px]">
<span class="material-symbols-outlined text-green-500">check_circle</span>
<span class="text-sm font-medium">Default address updated</span>
</div>
</div>
</body></html>
