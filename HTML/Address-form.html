<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Address Form</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec1380",
                        "background-light": "#f8f6f7",
                        "background-dark": "#221019",
                        "surface-dark": "#2d1b24", // Derived surface color
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar for clean look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #221019; 
        }
        ::-webkit-scrollbar-thumb {
            background: #4a2b38; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #ec1380; 
        }
        
        .toggle-checkbox:checked {
            right: 0;
            border-color: #ec1380;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #ec1380;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen font-display text-slate-900 dark:text-white flex flex-col overflow-x-hidden selection:bg-primary selection:text-white">
<!-- Top App Bar -->
<header class="sticky top-0 z-50 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-md border-b border-gray-200 dark:border-white/5 px-4 py-3 flex items-center justify-between">
<button class="size-10 flex items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors active:scale-95 text-slate-900 dark:text-white" type="button">
<span class="material-symbols-outlined text-[24px]">arrow_back_ios_new</span>
</button>
<h1 class="text-lg font-bold tracking-tight text-center flex-1 pr-10">Add New Address</h1>
</header>
<!-- Main Form Content -->
<main class="flex-1 w-full max-w-lg mx-auto p-5 pb-32">
<!-- Progress / Steps Indicator (Optional Visual Hint) -->
<div class="flex items-center gap-2 mb-8 px-1">
<div class="h-1 flex-1 bg-primary rounded-full"></div>
<div class="h-1 flex-1 bg-gray-200 dark:bg-white/10 rounded-full"></div>
<div class="h-1 flex-1 bg-gray-200 dark:bg-white/10 rounded-full"></div>
</div>
<form action="#" class="flex flex-col gap-6" onsubmit="event.preventDefault();">
<!-- Full Name -->
<div class="flex flex-col gap-2 group">
<label class="text-sm font-semibold text-gray-500 dark:text-gray-300 ml-1 group-focus-within:text-primary transition-colors" for="fullname">Full Name</label>
<div class="relative">
<input class="w-full bg-white dark:bg-white/5 border border-gray-200 dark:border-transparent rounded-xl px-4 py-3.5 text-base outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary placeholder:text-gray-400 dark:placeholder:text-white/20 transition-all" id="fullname" placeholder="Jane Doe" type="text"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 dark:text-white/20 pointer-events-none text-xl">person</span>
</div>
</div>
<!-- Street Address -->
<div class="flex flex-col gap-2 group">
<label class="text-sm font-semibold text-gray-500 dark:text-gray-300 ml-1 group-focus-within:text-primary transition-colors" for="street">Street Address</label>
<div class="relative">
<input class="w-full bg-white dark:bg-white/5 border border-gray-200 dark:border-transparent rounded-xl px-4 py-3.5 text-base outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary placeholder:text-gray-400 dark:placeholder:text-white/20 transition-all" id="street" placeholder="123 Fashion Ave" type="text"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 dark:text-white/20 pointer-events-none text-xl">home_pin</span>
</div>
</div>
<!-- City & State -->
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col gap-2 group">
<label class="text-sm font-semibold text-gray-500 dark:text-gray-300 ml-1 group-focus-within:text-primary transition-colors" for="city">City</label>
<input class="w-full bg-white dark:bg-white/5 border border-gray-200 dark:border-transparent rounded-xl px-4 py-3.5 text-base outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary placeholder:text-gray-400 dark:placeholder:text-white/20 transition-all" id="city" placeholder="New York" type="text"/>
</div>
<div class="flex flex-col gap-2 group">
<label class="text-sm font-semibold text-gray-500 dark:text-gray-300 ml-1 group-focus-within:text-primary transition-colors" for="state">State</label>
<div class="relative">
<select class="w-full bg-white dark:bg-white/5 border border-gray-200 dark:border-transparent rounded-xl px-4 py-3.5 text-base outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary text-slate-900 dark:text-white appearance-none cursor-pointer transition-all" id="state">
<option disabled="" selected="" value="">Select</option>
<option value="NY">NY</option>
<option value="CA">CA</option>
<option value="TX">TX</option>
<option value="FL">FL</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 dark:text-white/20 pointer-events-none text-xl">expand_more</span>
</div>
</div>
</div>
<!-- Zip Code & Phone -->
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col gap-2 group">
<label class="text-sm font-semibold text-gray-500 dark:text-gray-300 ml-1 group-focus-within:text-primary transition-colors" for="zip">Zip Code</label>
<input class="w-full bg-white dark:bg-white/5 border border-gray-200 dark:border-transparent rounded-xl px-4 py-3.5 text-base outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary placeholder:text-gray-400 dark:placeholder:text-white/20 transition-all" id="zip" inputmode="numeric" pattern="[0-9]*" placeholder="10001" type="text"/>
</div>
<div class="flex flex-col gap-2 group">
<label class="text-sm font-semibold text-gray-500 dark:text-gray-300 ml-1 group-focus-within:text-primary transition-colors" for="phone">Phone</label>
<input class="w-full bg-white dark:bg-white/5 border border-gray-200 dark:border-transparent rounded-xl px-4 py-3.5 text-base outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary placeholder:text-gray-400 dark:placeholder:text-white/20 transition-all" id="phone" placeholder="(555) 000-0000" type="tel"/>
</div>
</div>
<!-- Divider -->
<div class="h-px bg-gray-200 dark:bg-white/5 my-2"></div>
<!-- Default Address Toggle -->
<div class="flex items-center justify-between p-1">
<div class="flex flex-col">
<span class="text-base font-semibold text-slate-900 dark:text-white">Set as default address</span>
<span class="text-xs text-gray-500 dark:text-gray-400">Use this address for checkout</span>
</div>
<label class="relative inline-flex items-center cursor-pointer" for="default-toggle">
<input checked="" class="sr-only peer" id="default-toggle" type="checkbox"/>
<div class="w-12 h-7 bg-gray-200 dark:bg-white/10 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-primary/50 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
</form>
</main>
<!-- Bottom Action Bar -->
<footer class="fixed bottom-0 w-full p-4 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-xl border-t border-gray-200 dark:border-white/5 z-40">
<div class="max-w-lg mx-auto w-full">
<button class="w-full bg-primary hover:bg-primary/90 active:scale-[0.98] text-white font-bold text-lg rounded-xl py-4 shadow-[0_4px_14px_0_rgba(236,19,128,0.39)] transition-all flex items-center justify-center gap-2">
<span>Save Address</span>
<span class="material-symbols-outlined text-[20px]">check</span>
</button>
</div>
</footer>
<!-- 
      Skeleton Loading Preview (Hidden by default in production, but shown here for context)
      To view: remove 'hidden' class from the div below
    -->
<div class="hidden absolute inset-0 z-[60] bg-background-dark p-5 flex flex-col gap-6 animate-pulse">
<div class="h-10 w-10 bg-white/10 rounded-full mb-4"></div>
<div class="h-8 w-48 bg-white/10 rounded mb-8 mx-auto"></div>
<div class="space-y-2">
<div class="h-4 w-24 bg-white/10 rounded"></div>
<div class="h-14 w-full bg-white/5 rounded-xl"></div>
</div>
<div class="space-y-2">
<div class="h-4 w-32 bg-white/10 rounded"></div>
<div class="h-14 w-full bg-white/5 rounded-xl"></div>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="space-y-2">
<div class="h-4 w-16 bg-white/10 rounded"></div>
<div class="h-14 w-full bg-white/5 rounded-xl"></div>
</div>
<div class="space-y-2">
<div class="h-4 w-16 bg-white/10 rounded"></div>
<div class="h-14 w-full bg-white/5 rounded-xl"></div>
</div>
</div>
</div>
</body></html>
